name: Monthly Growth Rollup

on:
  schedule:
    - cron: '0 0 1 * *' # 1st of every month at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-growth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Monthly Snapshot & Growth Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python engine/run_pipeline.py

      - name: Commit Monthly Snapshot
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ data/current/ assets/generated/ README.md
          if git diff --staged --quiet; then
            echo "Monthly snapshot already committed."
          else
            git commit -m "chore(growth): monthly developer evolution report $(date -u +'%Y-%m') [skip ci]"
            git push
          fi
