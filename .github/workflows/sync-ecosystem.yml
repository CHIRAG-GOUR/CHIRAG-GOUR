name: Autonomous Ecosystem Sync

on:
  schedule:
    - cron: '0 */2 * * *' # Automatically runs every 2 hours (12 times a day)
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'assets/generated/**'
      - 'README.md'
      - 'data/current/**'
  repository_dispatch:
    types: [sync, repo-push]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Ecosystem Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python engine/run_pipeline.py

      - name: Commit & Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/ data/ README.md
          if git diff --staged --quiet; then
            echo "No changes detected. Ecosystem is up to date."
          else
            git commit -m "chore(ecosystem): autonomous sync $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
