<svg width="880" height="42" viewBox="0 0 880 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle dark terminal container matching GitHub code blocks -->
  <rect x="1" y="1" width="878" height="40" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>

  <!-- Live Pulse Dot -->
  <circle cx="24" cy="21" r="4.5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Terminal Label -->
  <text x="38" y="25" fill="#7D8590" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.5">
    CURRENTLY BUILDING //
  </text>

  <!-- Repo Badge -->
  <text x="210" y="25" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">
    [Eat-Better-Internship]
  </text>

  <!-- Commit Hash -->
  <text x="385" y="25" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">
    8950ed5
  </text>

  <!-- Commit Message -->
  <text x="448" y="25" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">
    feat: Module 5 Capstone (5.1 &amp; 5.2), Activity 4 3…
  </text>

  <!-- Right status -->
  <text x="855" y="25" text-anchor="end" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
    ● LIVE SYNC
  </text>
</svg>