      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="14" fill="url(#dj_bg)"/>
  <rect x="1" y="1" width="878" height="238" rx="13" stroke="#1E293B" stroke-width="1"/>

  <!-- Header -->
