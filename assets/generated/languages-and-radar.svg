<svg width="880" height="210" viewBox="0 0 880 210" fill="none" xmlns="http://www.w3.org/2000/svg"><!--backdrop--><rect x="0" y="0" width="880" height="210" rx="14" fill="#0D1117"/>
  <!-- ZERO WHITE BACKGROUND: Seamless Transparent Canvas -->

